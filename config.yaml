timezone: Asia/Manila
currency: USD
monthly_budget: 20
critical_resources: []          # resource IDs (or "provider/name") auto-stop never touches
database: cloud-control.db

auto_stop:
  enabled: true
  dry_run: true                 # flip to false after testing
  threshold_percent: 100
  grace_minutes: 15

# Apps group resources across providers. A resource belongs to the first app
# (alphabetically) that lists it under `resources` or whose `match_tags` all
# match. Resources matching no app show up as "unassigned".
# Channel IDs go in config.local.yaml (gitignored), not here.
apps:
  aquascale:
    match_tags: { project: aquascale }  # for resources tagged project=aquascale
    resources:                          # listed by name until the Azure resources are tagged
      - azure/aquascale-api-staging
      - azure/aquascale-portal-staging
      - azure/aquascale-backoffice-staging
    alerts_channel_id: ""               # #aquascale-alerts; empty = DISCORD_ALERTS_CHANNEL_ID
    critical: false                     # true = auto-stop never touches this app
  buddibucks:
    match_tags: { project: buddibucks } # not deployed on Azure; add its resources once its provider exists
  library:                              # C:\library-system, deployed as Azure Container App ca-athenaeum
    match_tags: { project: athenaeum }  # ca-athenaeum is tagged by library-system's Terraform
    alerts_channel_id: ""               # #library-alerts

dev:
  fake_provider: true           # demo resources; turn off once real providers are configured

azure:
  subscription_id: ""
  health_paths:
    aquascale-api-staging: /health
gcp:
  project_id: ""
  vision:
    free_units_per_month: 1000
    price_per_1000: 1.50
cloudflare:
  account_id: ""
  r2_buckets: []
  pricing:
    storage_gb_month: 0.015
    free_storage_gb: 10
resend:
  domains: []
  monthly_plan_cost: 0
